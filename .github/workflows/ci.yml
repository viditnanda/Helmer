# Build and test on every push and pull request.
name: ci
on: [push, pull_request]
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependencies (FLINT, msolve)
        run: sudo apt-get update && sudo apt-get install -y libflint-dev libmsolve-dev
      - name: Build and install
        run: python -m pip install scikit-build-core pybind11 pytest && python -m pip install --no-build-isolation .
      - name: Tests
        run: python -m pytest -q tests/
      - name: Examples and the command line
        run: sh examples/run_all.sh
      - name: C++ library, test drivers and example
        run: |
          cmake -S . -B build -DHELMER_PYTHON=OFF -DHELMER_TESTS=ON -DHELMER_EXAMPLES=ON
          cmake --build build -j2
          ./build/stratify "x,y,z" "y^2*z - x^2" | grep -q "dim 0"
          ./build/t_primes "x,y,z" "x*y*z" "x+y+z" | grep -q "3 primes"
