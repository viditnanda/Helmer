# On a version tag (e.g. v1.0.0): build the binary wheels (wheels.yml) and the source distribution, test
# them, attach them to a GitHub release and publish them to PyPI (trusted publishing; see RELEASING.md).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  wheels:
    uses: ./.github/workflows/wheels.yml
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the version being built
        run: |
          v=$(sed -n 's/^version = "\(.*\)".*/\1/p' pyproject.toml)
          p=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' python/helmer/__init__.py)
          echo "tag $GITHUB_REF_NAME, pyproject.toml $v, __init__.py $p"
          test "$GITHUB_REF_NAME" = "v$v" && test "$p" = "$v"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libflint-dev libmsolve-dev
      - name: Build the sdist
        run: python -m pip install build && python -m build --sdist
      - name: Install the sdist and test it
        run: |
          python -m pip install pytest dist/*.tar.gz
          cd /tmp && python -m pytest -q $GITHUB_WORKSPACE/tests/ && helmer "y^2*z - x^2"
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist/*.tar.gz }
  github-release:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
  pypi:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
